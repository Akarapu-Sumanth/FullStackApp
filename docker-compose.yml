services:
  postgres:
    image: postgres:16
    container_name: fullstackapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fullstackapp
      POSTGRES_USER: fullstackuser
      POSTGRES_PASSWORD: fullstackpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: